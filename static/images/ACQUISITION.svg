<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color: #07161D;">
  <title>Strategic Aircraft Acquisition</title>
  
  <!-- Technical Grid -->
  <defs>
    <pattern id="gridAcq" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B2D3A" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#gridAcq)" />
  
  <!-- Outer Corner Brackets -->
  <path d="M 20 40 V 20 H 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 360 20 H 380 V 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 20 360 V 380 H 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 360 380 H 380 V 360" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>

  <!-- Flight Path & Vector Range -->
  <path d="M 50 300 Q 150 250 200 180 T 350 100" fill="none" stroke="#C19A58" stroke-width="1.5" stroke-dasharray="6 3"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="#22384A" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Aircraft Wireframe / Silhouette -->
  <g transform="translate(160, 120) scale(1.1)">
    <path d="M 40 0 L 46 25 L 85 55 L 85 62 L 46 50 L 43 75 L 53 88 L 53 92 L 40 88 L 27 92 L 27 88 L 37 75 L 34 50 L -5 62 L -5 55 L 34 25 Z" fill="#0D1F2A" stroke="#E8EDF2" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="40" y1="0" x2="40" y2="88" stroke="#D7B77F" stroke-width="0.8"/>
  </g>

  <!-- Navigation Target Crosshair -->
  <circle cx="204" cy="120" r="18" fill="none" stroke="#D7B77F" stroke-width="1"/>
  <line x1="204" y1="95" x2="204" y2="145" stroke="#D7B77F" stroke-width="0.8"/>
  <line x1="179" y1="120" x2="229" y2="120" stroke="#D7B77F" stroke-width="0.8"/>

  <!-- Telemetry & Text Overlay -->
  <text x="30" y="40" fill="#C19A58" font-family="monospace" font-size="11" font-weight="bold">STRATEGIC AIRCRAFT ACQUISITION</text>
  <text x="30" y="55" fill="#8EA0AD" font-family="monospace" font-size="8">MISSION-READY PLATFORM SOURCING</text>
  
  <text x="30" y="365" fill="#D7B77F" font-family="monospace" font-size="9">RANGE: GLOBAL</text>
  <text x="370" y="365" fill="#E8EDF2" font-family="monospace" font-size="9" text-anchor="end">STATUS: ACTIVE</text>
</svg>
