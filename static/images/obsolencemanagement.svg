<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color: #07161D;">
  <title>Obsolescence Management</title>
  
  <!-- Technical Grid Background -->
  <defs>
    <pattern id="gridObs" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B2D3A" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#gridObs)" />
  
  <!-- Outer Corner Brackets -->
  <path d="M 20 40 V 20 H 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 360 20 H 380 V 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 20 360 V 380 H 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 360 380 H 380 V 360" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>

  <!-- Analytics Chart Base Grid & Axes -->
  <line x1="80" y1="280" x2="330" y2="280" stroke="#8EA0AD" stroke-width="1.5"/>
  <line x1="80" y1="120" x2="80" y2="280" stroke="#8EA0AD" stroke-width="1.5"/>
  
  <!-- Y-Axis Ticks -->
  <line x1="73" y1="160" x2="80" y2="160" stroke="#8EA0AD" stroke-width="1"/>
  <line x1="73" y1="200" x2="80" y2="200" stroke="#8EA0AD" stroke-width="1"/>
  <line x1="73" y1="240" x2="80" y2="240" stroke="#8EA0AD" stroke-width="1"/>

  <!-- Lifecycle Bar Chart (Steel Panel, Graphite, Soft Gold, Primary Gold) -->
  <!-- Bar 1: Legacy High -->
  <rect x="105" y="150" width="28" height="130" fill="#1B2D3A" stroke="#8EA0AD" stroke-width="1"/>
  <!-- Bar 2: Mid Phase -->
  <rect x="155" y="180" width="28" height="100" fill="#22384A" stroke="#8EA0AD" stroke-width="1"/>
  <!-- Bar 3: Critical Low / Sourcing Phase -->
  <rect x="205" y="220" width="28" height="60" fill="#0D1F2A" stroke="#D7B77F" stroke-width="1.5"/>
  <!-- Bar 4: Re-procured / Validated -->
  <rect x="255" y="130" width="28" height="150" fill="#0D1F2A" stroke="#C19A58" stroke-width="1.5"/>

  <!-- Lifecycle Curve Line (Gold Trend) -->
  <path d="M 90 140 Q 180 260 270 120 T 330 150" fill="none" stroke="#D7B77F" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Focus / Validation Marker Ring on Bar 4 -->
  <circle cx="269" cy="130" r="10" fill="none" stroke="#C19A58" stroke-width="1.5"/>
  <circle cx="269" cy="130" r="3" fill="#C19A58"/>

  <!-- Telemetry Text & Header Overlay -->
  <text x="30" y="40" fill="#C19A58" font-family="monospace" font-size="11" font-weight="bold">OBSOLESCENCE MANAGEMENT</text>
  <text x="30" y="55" fill="#8EA0AD" font-family="monospace" font-size="8">LEGACY FLEET COMPONENT SOURCING</text>
  
  <text x="30" y="365" fill="#E8EDF2" font-family="monospace" font-size="9">LIFECYCLE: EXTENDED</text>
  <text x="370" y="365" fill="#D7B77F" font-family="monospace" font-size="9" text-anchor="end">HARD-TO-FIND // LOCATED</text>
</svg>
