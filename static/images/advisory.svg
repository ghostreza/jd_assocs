<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color: #07161D;">
  <title>Technical Advisory &amp; Integration</title>

  <!-- Tactical Grid -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="#1B2D3A" stroke-width="1"/>
  <line x1="200" y1="40" x2="200" y2="360" stroke="#1B2D3A" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 20 40 V 20 H 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 360 20 H 380 V 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 20 360 V 380 H 40" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>
  <path d="M 360 380 H 380 V 360" fill="none" stroke="#8EA0AD" stroke-width="1.5"/>

  <!-- Degree Arc & Alignment Markers -->
  <path d="M 100 200 A 100 100 0 0 1 300 200" fill="none" stroke="#22384A" stroke-width="1.5"/>
  <path d="M 130 200 A 70 70 0 0 1 270 200" fill="none" stroke="#C19A58" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Wrench Blueprint Silhouette (Rotated Tactical Angle) -->
  <g transform="translate(200, 200) rotate(-45)">
    <!-- Wrench Body -->
    <path d="M -12 -70 H 12 V 70 H -12 Z" fill="#0D1F2A" stroke="#E8EDF2" stroke-width="1.5"/>
    
    <!-- Open Head Top -->
    <path d="M -25 -80 C -25 -100 25 -100 25 -80 C 25 -65 15 -60 12 -60 H -12 C -15 -60 -25 -65 -25 -80 Z" fill="#0D1F2A" stroke="#E8EDF2" stroke-width="1.5"/>
    <path d="M -10 -95 L 0 -80 L 10 -95" fill="none" stroke="#07161D" stroke-width="2"/>
    
    <!-- Ring Head Bottom -->
    <circle cx="0" cy="85" r="22" fill="#0D1F2A" stroke="#E8EDF2" stroke-width="1.5"/>
    <circle cx="0" cy="85" r="12" fill="#07161D" stroke="#D7B77F" stroke-width="1.5"/>
    
    <!-- Center Guide Line -->
    <line x1="0" y1="-95" x2="0" y2="100" stroke="#D7B77F" stroke-width="0.8" stroke-dasharray="3 3"/>
  </g>

  <!-- Integration Target Brackets -->
  <path d="M 170 170 H 150 V 190" fill="none" stroke="#E8EDF2" stroke-width="1"/>
  <path d="M 230 170 H 250 V 190" fill="none" stroke="#E8EDF2" stroke-width="1"/>
  <path d="M 170 230 H 150 V 210" fill="none" stroke="#E8EDF2" stroke-width="1"/>
  <path d="M 230 230 H 250 V 210" fill="none" stroke="#E8EDF2" stroke-width="1"/>

  <!-- Telemetry Text Overlay -->
  <text x="30" y="40" fill="#C19A58" font-family="monospace" font-size="11" font-weight="bold">TECHNICAL ADVISORY &amp; INTEGRATION</text>
  <text x="30" y="55" fill="#8EA0AD" font-family="monospace" font-size="8">SYSTEM BENCHMARK &amp; COMPLIANCE</text>
  
  <text x="30" y="365" fill="#D7B77F" font-family="monospace" font-size="9">ALIGNMENT: 100%</text>
  <text x="370" y="365" fill="#E8EDF2" font-family="monospace" font-size="9" text-anchor="end">SYS_INT // OK</text>
</svg>
