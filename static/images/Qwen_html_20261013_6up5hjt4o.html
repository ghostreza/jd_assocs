<canvas id="flowCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></canvas>

<script>
const canvas = document.getElementById('flowCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class FlowLine {
  constructor() {
    this.reset();
  }
  
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.length = Math.random() * 100 + 50;
    this.speed = Math.random() * 0.5 + 0.2;
    this.angle = Math.random() * Math.PI * 2;
    this.opacity = Math.random() * 0.3 + 0.1;
    this.curve = Math.random() * 0.02 - 0.01;
  }
  
  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.angle += this.curve;
    
    if (this.x < -100 || this.x > canvas.width + 100 || 
        this.y < -100 || this.y > canvas.height + 100) {
      this.reset();
    }
  }
  
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(
      this.x + Math.cos(this.angle) * this.length,
      this.y + Math.sin(this.angle) * this.length
    );
    ctx.strokeStyle = `rgba(123, 168, 145, ${this.opacity})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

const lines = Array.from({ length: 50 }, () => new FlowLine());

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  lines.forEach(line => {
    line.update();
    line.draw();
  });
  requestAnimationFrame(animate);
}
animate();
</script>
