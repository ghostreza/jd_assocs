<canvas id="gridCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></canvas>

<script>
const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const gridSize = 80;
const dots = [];

class Dot {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.baseX = x;
    this.baseY = y;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.02 + 0.01;
    this.radius = Math.random() * 2 + 1;
  }
  
  update() {
    this.angle += this.speed;
    this.x = this.baseX + Math.cos(this.angle) * 10;
    this.y = this.baseY + Math.sin(this.angle) * 10;
  }
  
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(123, 168, 145, 0.4)';
    ctx.fill();
  }
}

for (let x = 0; x < canvas.width; x += gridSize) {
  for (let y = 0; y < canvas.height; y += gridSize) {
    dots.push(new Dot(x, y));
  }
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(232, 228, 220, 0.3)';
  ctx.lineWidth = 0.5;
  
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  dots.forEach(dot => {
    dot.update();
    dot.draw();
  });
  requestAnimationFrame(animate);
}
animate();
</script>
